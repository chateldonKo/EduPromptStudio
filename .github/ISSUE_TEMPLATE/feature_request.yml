name: 🚀 新功能建议
description: 为项目提一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决的问题
      description: 这个功能想解决什么实际场景下的痛点？
      placeholder: |
        例如：每次都要从头填表单，希望能保存最近一次输入 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你心目中理想的解决方式（可粗略）
      placeholder: |
        例如：在表单上方加一个「最近 5 次输入」下拉框 ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 还想过别的做法吗？为什么没选？

  - type: textarea
    id: context
    attributes:
      label: 补充上下文（可选）
      description: 截图、参考链接、相关 issue 等。
