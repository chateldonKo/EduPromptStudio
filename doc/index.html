<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPrompt Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #1f2937;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      height: 72px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .header span {
      font-size: 14px;
      color: #6b7280;
      margin-top: 4px;
      display: block;
    }

    .container {
      display: flex;
      height: calc(100vh - 72px);
    }

    .left-panel {
      width: 40%;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      padding: 28px;
      overflow-y: auto;
    }

    .right-panel {
      width: 60%;
      padding: 28px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .generate-btn {
      background: #2563eb;
      color: white;
    }

    .generate-btn:hover {
      background: #1d4ed8;
    }

    .copy-btn {
      background: #111827;
      color: white;
    }

    .copy-btn:hover {
      background: #000000;
    }

    .output-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      min-height: calc(100vh - 160px);
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 14px;
      overflow-wrap: break-word;
    }

    .tag {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      .left-panel,
      .right-panel {
        width: 100%;
        height: auto;
      }

      body {
        overflow: auto;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>EduPrompt Studio</h1>
      <span>高校行政 AI 公文 Prompt 工具箱</span>
    </div>
  </div>

  <div class="container">
    <div class="left-panel">
      <div class="section-title">输入信息</div>

      <div class="form-group">
        <label>学院名称</label>
        <input type="text" id="college" placeholder="例如：机电工程学院" />
      </div>

      <div class="form-group">
        <label>材料类型</label>
        <select id="templateType">
          <option value="rectification">整改类</option>
          <option value="summary">总结汇报类</option>
          <option value="implementation">方案类</option>
          <option value="project">项目申报类</option>
          <option value="research">调研分析类</option>
          <option value="meeting">会议纪要类</option>
          <option value="notice">通知说明类</option>
          <option value="speech">讲话稿类</option>
          <option value="accreditation">教学认证类</option>
        </select>
      </div>

      <div class="form-group">
        <label>风格</label>
        <select id="style">
          <option value="正式稳妥">正式稳妥</option>
          <option value="客观分析">客观分析</option>
          <option value="领导讲话">领导讲话</option>
          <option value="简洁通知">简洁通知</option>
          <option value="数据分析型">数据分析型</option>
        </select>
      </div>

      <div class="form-group">
        <label>问题 / 主题</label>
        <textarea id="topic" placeholder="例如：毕业设计抽检不合格整改"></textarea>
      </div>

      <div class="form-group">
        <label>补充背景</label>
        <textarea id="background" placeholder="例如：学校开展本科毕业设计专项检查，发现部分材料不规范"></textarea>
      </div>

      <div class="button-group">
        <button class="generate-btn" onclick="generatePrompt()">生成 Prompt</button>
        <button class="copy-btn" onclick="copyPrompt()">复制 Prompt</button>
      </div>

      <div class="footer-note">
        本工具仅生成 Prompt，不直接生成公文内容。<br>
        建议配合 ChatGPT、Claude、DeepSeek 等 AI 工具使用。
      </div>
    </div>

    <div class="right-panel">
      <div class="section-title">生成结果</div>

      <div id="tags"></div>

      <div class="output-box" id="output">
请填写左侧内容后点击「生成 Prompt」。
      </div>
    </div>
  </div>

  <script>
    const templates = {
      rectification: {
        name: "整改类",
        structure: ["问题情况", "原因分析", "整改措施", "长效机制"],
        tone: ["正式", "稳妥", "克制"],
        forbidden: ["极其严重", "完全失败", "恶劣影响"]
      },
      summary: {
        name: "总结汇报类",
        structure: ["工作开展情况", "工作成效", "存在问题", "下一步计划"],
        tone: ["正式", "客观", "成绩优先"],
        forbidden: ["历史性突破", "全国领先", "成果丰硕"]
      },
      implementation: {
        name: "方案类",
        structure: ["背景与目标", "工作内容", "实施步骤", "保障措施"],
        tone: ["正式", "强调执行", "强调组织性"],
        forbidden: ["全面升级", "尽快完成", "全面革新"]
      },
      project: {
        name: "项目申报类",
        structure: ["项目背景", "建设目标", "建设内容", "实施路径", "预期成果", "经费预算"],
        tone: ["正式", "成果导向", "强调必要性"],
        forbidden: ["革命性创新", "全国唯一", "绝对领先"]
      },
      research: {
        name: "调研分析类",
        structure: ["调研背景", "现状分析", "问题分析", "对策建议"],
        tone: ["客观", "逻辑严谨", "数据导向"],
        forbidden: ["明显失败", "效果极差", "管理混乱"]
      },
      meeting: {
        name: "会议纪要类",
        structure: ["会议基本情况", "会议讨论内容", "会议决定事项"],
        tone: ["简洁", "客观", "强调落实"],
        forbidden: ["会议圆满成功", "现场气氛热烈"]
      },
      notice: {
        name: "通知说明类",
        structure: ["事项背景", "工作要求", "时间安排", "注意事项"],
        tone: ["简洁", "正式", "明确"],
        forbidden: ["深入贯彻落实", "全面加强"]
      },
      speech: {
        name: "讲话稿类",
        structure: ["工作回顾", "当前形势", "工作要求", "总结强调"],
        tone: ["正式", "强调站位", "有层次"],
        forbidden: ["掌声热烈", "携手共创辉煌"]
      },
      accreditation: {
        name: "教学认证类",
        structure: ["基本情况", "建设成效", "存在问题", "改进措施"],
        tone: ["规范", "客观", "持续改进"],
        forbidden: ["全国顶尖", "成果卓著", "全面优秀"]
      }
    };

    function generatePrompt() {
      const college = document.getElementById('college').value.trim();
      const type = document.getElementById('templateType').value;
      const style = document.getElementById('style').value;
      const topic = document.getElementById('topic').value.trim();
      const background = document.getElementById('background').value.trim();

      const template = templates[type];

      const structureText = template.structure.map(item => `- ${item}`).join('\n');
      const toneText = template.tone.map(item => `- ${item}`).join('\n');
      const forbiddenText = template.forbidden.map(item => `- ${item}`).join('\n');

      const prompt = `你现在是高校行政工作人员。\n\n请根据以下内容，生成一份${template.name}正式材料。\n\n【学院名称】\n${college || '待填写'}\n\n【主题内容】\n${topic || '待填写'}\n\n【补充背景】\n${background || '无'}\n\n请严格按照以下结构输出：\n${structureText}\n\n语言风格要求：\n${toneText}\n- 使用高校正式行政公文风格\n- 避免空话套话\n- 强调可执行性\n- 保持语言客观稳妥\n\n禁止使用以下表达：\n${forbiddenText}\n\n输出要求：\n1. 内容符合高校内部行政材料风格\n2. 不要使用网络化语言\n3. 不要夸张宣传\n4. 不出现明显AI痕迹\n5. 保持结构完整、逻辑清晰`; 

      document.getElementById('output').textContent = prompt;

      document.getElementById('tags').innerHTML = `
        <span class="tag">${template.name}</span>
        <span class="tag">${style}</span>
        <span class="tag">${college || '未填写学院'}</span>
      `;
    }

    function copyPrompt() {
      const text = document.getElementById('output').textContent;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(() => {
            alert('Prompt 已复制');
          })
          .catch(() => {
            fallbackCopy(text);
          });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          alert('Prompt 已复制');
        } else {
          alert('复制失败，请手动复制');
        }
      } catch (err) {
        alert('复制失败，请手动复制');
      }

      document.body.removeChild(textarea);
    }
  </script>
</body>
</html>
